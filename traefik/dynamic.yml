# Routage Traefik LOCAL uniquement — reproduit un reverse proxy HTTPS pour le
# dev. Routage volontairement minimal (localhost) : à adapter si un schéma de
# routage plus proche de la production est nécessaire (voir dynamic-new.yml,
# en cours de définition séparément pour l'infra distante).
tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem

http:
  routers:
    frontend:
      rule: "Host(`localhost`)"
      entryPoints:
        - websecure
      service: frontend
      tls: {}

    # /health est servi par core lui-même (backend/core/api/controller/health.py),
    # pas par un service Traefik séparé.
    core:
      rule: "Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`))"
      entryPoints:
        - websecure
      service: core
      tls: {}

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:8501"

    core:
      loadBalancer:
        servers:
          - url: "http://core:8000"
