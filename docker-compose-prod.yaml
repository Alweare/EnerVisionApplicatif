services:
  authentication:
    image: ${AUTHENTICATION_IMAGE}
    restart: unless-stopped
    networks:
      - g3_default
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: auth.enervisiong3.prod
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    secrets:
      - keycloak_client_secret
      - keycloak_frontend_client_secret
      - keycloak_db_password
    depends_on:
      keycloak-db:
        condition: service_healthy

  # Pas buildée depuis le repo (image Postgres standard) : le pipeline ne la
  # déploiera jamais automatiquement. Premier démarrage manuel obligatoire
  # (cf. doc Confluence Keycloak, §7).
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - g3_default
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    secrets:
      - keycloak_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    image: ${CORE_IMAGE}
    restart: unless-stopped
    networks:
      - g3_default
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

  etl:
    image: ${ETL_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}

  prediction:
    image: ${PREDICTION_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME}
      MIN_IMPROVEMENT_VS_BASELINE: ${MIN_IMPROVEMENT_VS_BASELINE}
      MIN_IMPROVEMENT_VS_CHAMPION: ${MIN_IMPROVEMENT_VS_CHAMPION}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD}
      MIN_NEW_ROWS: ${MIN_NEW_ROWS}

  recommandation:
    image: ${RECOMMANDATION_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}

secrets:
  keycloak_client_secret:
    file: ./secrets/keycloak_client_secret

  keycloak_frontend_client_secret:
    file: ./secrets/keycloak_frontend_client_secret

  keycloak_db_password:
    file: ./secrets/keycloak_db_password

networks:
  g3_default:
    external: true

volumes:
  keycloak_db_data: