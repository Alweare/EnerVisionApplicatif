global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus se surveille lui-même
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # Serveur Linux
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  # Conteneurs Docker
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  # API core (FastAPI, prometheus-fastapi-instrumentator) — EN-280.
  # "down" tant que core n'a pas de vraie base Postgres déployée sur ce
  # serveur (pas encore le cas, hors scope de ce ticket).
  - job_name: "core"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "core:8000"
