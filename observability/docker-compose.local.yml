# Override LOCAL uniquement : publie les ports sur la machine et remplace le
# réseau Traefik (g3_default, qui n'existe que sur le serveur) par un réseau
# créé à la volée. Ne JAMAIS utiliser sur le serveur.
services:
  grafana:
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

  prometheus:
    ports:
      - "9090:9090"

  loki:
    ports:
      - "3100:3100"

  node-exporter:
    profiles: ["linux-only"]


networks:
  traefik_network:
    external: false
