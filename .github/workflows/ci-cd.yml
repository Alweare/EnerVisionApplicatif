name: CI/CD

on:
  push:

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: enervisiong3

jobs:

  # ============================================================
  # Détection des services impactés
  # ============================================================

  changes:
    name: Detect impacted services
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      services: ${{ steps.matrix.outputs.services }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend/etl: 'backend/etl/**'
            backend/prediction: 'backend/prediction/**'
            backend/core: 'backend/core/**'
            backend/workeringestion: 'backend/workeringestion/**'
            frontend: 'frontend/**'

      - name: Build service matrix
        id: matrix
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          # main = on redéploie tout, changé ou non (garantit un environnement
          # cohérent après un merge develop -> main). Cette liste doit rester
          # synchronisée avec les clés de `filters:` ci-dessus.
          # backend/recommendation n'a pas encore de Dockerfile (package vide,
          # jamais buildé) : volontairement absent tant qu'il n'est pas
          # déployable. authentication/ (ex backend/authentication) n'est pas
          # non plus dans cette liste : Keycloak est géré hors de ce repo,
          # jamais redéployé automatiquement (voir deploy.sh, qui le rejette).
          ALL_SERVICES: >-
            ["backend/etl","backend/prediction",
            "backend/core","backend/workeringestion","frontend"]
          DEPLOY_ALL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_ALL" = "true" ]; then
            PATHS="$ALL_SERVICES"
          else
            PATHS="$CHANGES"
          fi

          SERVICES=$(jq -c '
            [ .[] | {
                name: (split("/") | last),
                dir: .,
                root: (split("/") | first),
                context: (
                  if . == "frontend"
                  then "frontend"
                  else "."
                  end
                )
              } ]' <<< "$PATHS")

          if [ "$SERVICES" = "[]" ]; then
            HAS_CHANGES=false
          else
            HAS_CHANGES=true
          fi

          {
            echo "services=$SERVICES"
            echo "has_changes=$HAS_CHANGES"
          } >> "$GITHUB_OUTPUT"

          echo "### Services impactés" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.name) (`\(.dir)`) - context: `\(.context)`"' <<< "$SERVICES" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # STAGE 1 : TEST
  # ============================================================

  test:
    name: Test - ${{ matrix.service.name }}
    needs: changes

    if: needs.changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # actions/setup-python avec cache: pip exige de trouver au moins un
      # requirements*.txt : plante avant même d'atteindre la vérification
      # plus bas pour un service sans code Python (aucun cas actuel dans la
      # matrice, gardé par sécurité si un futur package n'en a pas).
      - name: Check for Python files
        id: check
        env:
          SERVICE_DIR: ${{ matrix.service.dir }}
        run: |
          set -euo pipefail

          if [ -z "$(find "$SERVICE_DIR" -name '*.py' -print -quit)" ]; then
            echo "::notice::Aucun fichier Python dans $SERVICE_DIR (ex. image Keycloak) — tests ignorés."
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service.dir }}/requirements*.txt

      - name: Install dependencies
        if: steps.check.outputs.has_python == 'true'
        working-directory: ${{ matrix.service.dir }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          pip install pytest pytest-cov

      - name: Run tests for impacted service
        if: steps.check.outputs.has_python == 'true'
        env:
          SERVICE_DIR: ${{ matrix.service.dir }}
          SERVICE_ROOT: ${{ matrix.service.root }}
        run: |
          set -euo pipefail

          TEST_DIR="$SERVICE_DIR/tests"

          if [ ! -d "$TEST_DIR" ]; then
            echo "::error::Aucun dossier de tests trouvé pour $SERVICE_DIR"
            exit 1
          fi

          export PYTHONPATH="$PWD/$SERVICE_DIR:$PWD/$SERVICE_ROOT:${PYTHONPATH:-}"

          python -m pytest "$TEST_DIR" \
            --cov="$SERVICE_DIR" \
            --cov-report=xml:"$SERVICE_DIR/coverage.xml" \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.dir }}/coverage.xml
          retention-days: 7
          if-no-files-found: warn


  # ============================================================
  # STAGE 2 : BUILD + SCAN
  #
  # PR              -> build + scan
  # main/develop    -> build + scan
  # ============================================================

  build:
    name: Build & scan - ${{ matrix.service.name }}

    needs:
      - changes
      - test

    if: >
      needs.changes.outputs.has_changes == 'true' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        )
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dir }}/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_IGNORE_UNFIXED: "true"
          TRIVY_SEVERITY: "CRITICAL,HIGH"
          TRIVY_SCANNERS: "vuln"
          TRIVY_SKIP_VERSION_CHECK: "true"
          TRIVY_DISABLE_VEX_NOTICE: "true"
          # CVE ignorées au cas par cas (jamais en bloc) — voir .trivyignore
          # à la racine pour la justification de chacune.
          TRIVY_IGNOREFILE: ".trivyignore"
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          format: table
          exit-code: "1"

      - name: Save Docker image
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          set -euo pipefail

          docker save \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}" \
            | gzip > "${{ matrix.service.name }}.tar.gz"

      - name: Upload Docker image artifact
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.service.name }}
          path: ${{ matrix.service.name }}.tar.gz
          retention-days: 1
          compression-level: 0


  # ============================================================
  # STAGE 3 : PUBLISH
  #
  # main    -> SHA + latest
  # develop -> SHA seulement (latest reste réservé à main)
  # ============================================================

  publish:
    name: Publish - ${{ matrix.service.name }}

    needs:
      - changes
      - build

    if: >
      needs.changes.outputs.has_changes == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: docker-image-${{ matrix.service.name }}

      - name: Load Docker image
        run: |
          set -euo pipefail
          gunzip -c "${{ matrix.service.name }}.tar.gz" | docker load

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}"

          docker push "$IMAGE:${{ github.sha }}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi


  # ============================================================
  # STAGE 4 : DEPLOY PRODUCTION
  # ============================================================

  deploy:
    name: Deploy production

    needs:
      - changes
      - publish

    if: >
      needs.changes.outputs.has_changes == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    runs-on:
      - self-hosted
      - linux

    timeout-minutes: 30

    environment:
      name: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # deploy.sh vit à la fois dans le repo (versionné) et sur le serveur
      # (/opt/enervisionG3/deploy.sh, exécuté directement) : sans cette
      # synchronisation, un changement de deploy.sh mergé sur main/develop
      # ne prend jamais effet tant que quelqu'un ne le copie pas à la main.
      - name: Sync deploy.sh vers le serveur
        run: |
          set -euo pipefail
          cp deploy.sh /opt/enervisionG3/deploy.sh
          chmod +x /opt/enervisionG3/deploy.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy impacted services
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          while read -r name dir; do
            echo "Deploying $name ($dir)..."

            SERVICE="$name" \
            SERVICE_DIR="$dir" \
            IMAGE="$REGISTRY/$IMAGE_PREFIX/$name:$GIT_SHA" \
            /opt/enervisionG3/deploy.sh

          done < <(jq -r '.[] | "\(.name) \(.dir)"' <<< "$SERVICES")


  # ============================================================
  # STAGE 5 : DAST PRODUCTION
  # ============================================================

  dast:
    name: DAST production

    needs:
      - changes
      - deploy

    if: >
      needs.changes.outputs.has_changes == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    runs-on:
      - self-hosted
      - linux

    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Check application availability
        env:
          DAST_URL: ${{ secrets.DAST_URL }}
        run: |
          set -euo pipefail

          curl -fsS \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$DAST_URL/health" > /dev/null

          echo "Application disponible."

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.DAST_URL }}
          allow_issue_writing: false