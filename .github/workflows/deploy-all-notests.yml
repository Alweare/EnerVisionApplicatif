name: Deploy All (sans tests)

# Déclenchement manuel uniquement :
# build + scan + publish + deploy de TOUS les services,
# sans passer par les tests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-all-notests
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: enervisiong3

jobs:

  # ============================================================
  # MATRICE DES SERVICES
  # ============================================================

  matrix:
    name: Build service matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      services: ${{ steps.matrix.outputs.services }}

    steps:
      - name: Build service matrix
        id: matrix
        run: |
          set -euo pipefail

          SERVICES=$(jq -c '
            [ .[] | {
                name: (split("/") | last),
                dir: .,
                context: (
                  if . == "frontend"
                  then "frontend"
                  elif . == "db"
                  then "db"
                  elif . == "mlflow"
                  then "mlflow"
                  else "."
                  end
                )
              } ]' <<< '[
                "backend/etl",
                "backend/prediction",
                "backend/core",
                "backend/workeringestion",
                "frontend",
                "db",
                "mlflow"
              ]')

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          echo "### Services à déployer (sans tests)" >> "$GITHUB_STEP_SUMMARY"

          jq -r \
            '.[] | "- \(.name) (`\(.dir)`) — context: `\(.context)`"' \
            <<< "$SERVICES" \
            >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # BUILD + PUBLISH
  # ============================================================

  build:
    name: Build & publish - ${{ matrix.service.name }}

    needs:
      - matrix

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.matrix.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dir }}/Dockerfile

          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest

          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}


  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================

  deploy:
    name: Deploy production

    needs:
      - matrix
      - build

    runs-on:
      - self-hosted
      - linux

    timeout-minutes: 30

    environment:
      name: production

    permissions:
      contents: read
      packages: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # Synchronisation du script de déploiement
      # --------------------------------------------------------

      - name: Sync deploy.sh vers le serveur
        run: |
          set -euo pipefail

          cp deploy.sh /opt/enervisionG3/deploy.sh

          chmod +x /opt/enervisionG3/deploy.sh


      # --------------------------------------------------------
      # Login GHCR depuis le serveur
      # --------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Déploiement de tous les services
      # --------------------------------------------------------

      - name: Deploy all services
        env:
          SERVICES: ${{ needs.matrix.outputs.services }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GIT_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          while read -r name dir; do

            echo "=================================================="
            echo "Deploying $name"
            echo "Directory: $dir"
            echo "Image: $REGISTRY/$IMAGE_PREFIX/$name:$GIT_SHA"
            echo "=================================================="

            SERVICE="$name" \
            SERVICE_DIR="$dir" \
            IMAGE="$REGISTRY/$IMAGE_PREFIX/$name:$GIT_SHA" \
            /opt/enervisionG3/deploy.sh

          done < <(
            jq -r \
              '.[] | "\(.name) \(.dir)"' \
              <<< "$SERVICES"
          )