services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/backend/backend

    command: uvicorn backend.main:backend --host 0.0.0.0 --port 8000 --reload

secrets:
  keycloak_client_secret:
    file: ./secrets/keycloak_client_secret