tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem

http:
  routers:

    core:
      rule: "Host(`api.enervisiong3.local`)"
      entryPoints:
        - websecure
      service: core
      tls: {}

    grafana:
      rule: "Host(`grafana.enervisiong3.local`)"
      entryPoints:
        - websecure
      service: grafana
      tls: {}

  services:

    core:
      loadBalancer:
        servers:
          - url: "http://core:8000"

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"