services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - enervision_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  migration:
    container_name: migration
    build: db
    networks:
      - enervision_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYWAY_TYPE: postgres
      PYWAY_TABLE: public.pyway
      PYWAY_DATABASE_USERNAME: ${POSTGRES_USER}
      PYWAY_DATABASE_PASSWORD: ${POSTGRES_PWD}
      PYWAY_DATABASE_HOST: postgres
      PYWAY_DATABASE_PORT: 5432
      PYWAY_DATABASE_NAME: ${POSTGRES_DB}
      PYWAY_DATABASE_MIGRATION_DIR: migrations
      APP_DB_USER: ${POSTGRES_APP_USER}
      APP_DB_PASSWORD: ${POSTGRES_APP_PWD}

  mlflow:
    build:
      context: ./mlflow
    container_name: mlflow
    restart: unless-stopped
    networks:
      - enervision_network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER_MLFLOW}:${POSTGRES_PASSWORD_MLFLOW}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination /mlflow-artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow:5000,mlflow,localhost:*,127.0.0.1:*"

  core:
    build:
      context: .
      dockerfile: backend/core/Dockerfile
    restart: unless-stopped
    networks:
      - enervision_network
    ports:
      - "8002:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy

  etl:
    build:
      context: .
      dockerfile: backend/etl/Dockerfile
    restart: unless-stopped
    networks:
      - enervision_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_SAS_ETL: ${AZURE_SAS_ETL}
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-60}
      ETL_LOOKBACK_MINUTES: ${ETL_LOOKBACK_MINUTES:-1440}
      ETL_FORWARD_FILL_DEPTH: ${ETL_FORWARD_FILL_DEPTH:-3}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m etl.main

  prediction:
    build:
      context: .
      dockerfile: backend/prediction/Dockerfile
    restart: unless-stopped
    networks:
      - enervision_network
    ports:
      - "8003:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-consumption-prediction}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-consumption-predictor}
      MIN_IMPROVEMENT_VS_BASELINE: ${MIN_IMPROVEMENT_VS_BASELINE:-0.05}
      MIN_IMPROVEMENT_VS_CHAMPION: ${MIN_IMPROVEMENT_VS_CHAMPION:-0.01}
      DRIFT_THRESHOLD: ${DRIFT_THRESHOLD:-0.2}
      MIN_NEW_ROWS: ${MIN_NEW_ROWS:-1440}
      PREDICTION_SCHEDULER_ENABLED: ${PREDICTION_SCHEDULER_ENABLED:-true}
      PREDICTION_FORECAST_INTERVAL_MINUTES: ${PREDICTION_FORECAST_INTERVAL_MINUTES:-60}
      PREDICTION_FORECAST_HOURS: ${PREDICTION_FORECAST_HOURS:-48}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - enervision_network
    ports:
      - "8501:8501"
    environment:
      CORE_URL: ${CORE_URL:-http://core:8000}
    volumes:
      - ./frontend/.streamlit/secrets.toml:/frontend/.streamlit/secrets.toml:ro
    depends_on:
      - core

  worker-ingestion:
    build:
      context: .
      dockerfile: backend/workeringestion/Dockerfile
    restart: unless-stopped
    networks:
      - enervision_network
    environment:
      MOCK_API_URL: ${MOCK_API_URL}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_SAS_INGESTION: ${AZURE_SAS_INGESTION}

networks:
  enervision_network:
    name: enervision_network

volumes:
  postgresql_data:
  mlflow_artifacts:
