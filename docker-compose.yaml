services:
  # traefik:
  #   image: traefik:v3.7
  #   container_name: traefik
  #   cap_add:
  #     - NET_BIND_SERVICE
  #   command:
  #     - --entrypoints.websecure.address=:443
  #     - --providers.file.filename=/etc/traefik/dynamic.yml
  #   ports:
  #     - 443:443
  #   volumes:
  #     - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
  #     - ./certs:/certs:ro
  backend:
    networks:
      - enervision_network
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/backend

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    secrets:
      - keycloak_client_secret
    depends_on:
      - keycloak

  keycloak:
    build:
      context: .
      dockerfile: backend/authentication/Dockerfile
    networks:
      - enervision_network
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    secrets:
      - keycloak_client_secret
      - keycloak_frontend_client_secret
      - keycloak_db_password
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    networks:
      - enervision_network
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    secrets:
      - keycloak_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks:
      - enervision_network
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/frontend

  worker-ingestion:
    build:
      context: .
      dockerfile: backend/workeringestion/Dockerfile

    environment:
      MOCK_API_URL: http://10.105.200.45:8000
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_SAS_INGESTION: ${AZURE_SAS_INGESTION}

    volumes:
      - ./backend/core:/backend/core
      - ./backend/workeringestion:/backend/workeringestion

    command: python -m workeringestion.main

  etl:
    networks:
      - enervision_network
    build:
      context: .
      dockerfile: backend/etl/Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_SAS_ETL: ${AZURE_SAS_ETL}
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-60}
      ETL_LOOKBACK_MINUTES: ${ETL_LOOKBACK_MINUTES:-1440}
      ETL_FORWARD_FILL_DEPTH: ${ETL_FORWARD_FILL_DEPTH:-3}

    volumes:
      - ./backend/etl:/backend/etl

    command: python -m etl.main

  prediction:
    networks:
      - enervision_network
    build:
      context: .
      dockerfile: backend/prediction/Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}

    volumes:
      - ./backend/prediction:/backend/prediction
      - ./backend/shared:/backend/shared

    command: python -m prediction.main

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    networks:
      - enervision_network
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  migration:
    networks:
      - enervision_network
    container_name: migration
    build: db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYWAY_TYPE: postgres
      PYWAY_TABLE: public.pyway
      PYWAY_DATABASE_USERNAME: ${POSTGRES_USER}
      PYWAY_DATABASE_PASSWORD: ${POSTGRES_PWD}
      PYWAY_DATABASE_HOST: postgres
      PYWAY_DATABASE_PORT: 5432
      PYWAY_DATABASE_NAME: ${POSTGRES_DB}
      PYWAY_DATABASE_MIGRATION_DIR: migrations

volumes:
  postgresql_data:
  keycloak_db_data:

networks:
  enervision_network:
    external: true
    
secrets:
  db_password:
    file: ./secrets/db_password

  keycloak_client_secret:
    file: ./secrets/keyCloakSecrets/keycloak_client_secret

  keycloak_frontend_client_secret:
    file: ./secrets/keyCloakSecrets/keycloak_frontend_client_secret

  keycloak_db_password:
    file: ./secrets/keyCloakSecrets/keycloak_db_password
