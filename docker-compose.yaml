# postgres/migration/mlflow vivent uniquement dans docker-compose-data.yaml
# (source unique). Ce fichier dépend de ces services (`depends_on: postgres`)
# mais ne les définit pas : toujours le combiner avec
# `-f docker-compose-data.yaml` (voir docker.ps1), jamais seul.
services:
  # Keycloak "prod-style" (buildé, adossé à keycloak-db) : jamais démarré par
  # défaut (ni en local, ni par un `docker compose up -d` nu). Nécessite
  # `--profile prod` explicitement — évite la collision avec le Keycloak
  # local autonome de docker-compose-keycloak.yaml (même nom de conteneur,
  # même port 8080).
  keycloak:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: authentication/Dockerfile
    networks:
      - enervision_network
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
    secrets:
      - keycloak_client_secret
      - keycloak_frontend_client_secret
      - keycloak_db_password
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    profiles: ["prod"]
    image: postgres:16-alpine
    networks:
      - enervision_network
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    secrets:
      - keycloak_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    networks:
      - enervision_network
    ports:
      - "8501:8501"
    environment:
      CORE_URL: ${CORE_URL}
    volumes:
      - ./frontend/.streamlit/secrets.toml:/frontend/.streamlit/secrets.toml:ro

  worker-ingestion:
    build:
      context: .
      dockerfile: backend/workeringestion/Dockerfile
    networks:
      - enervision_network
    environment:
      MOCK_API_URL: ${MOCK_API_URL}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_SAS_INGESTION: ${AZURE_SAS_INGESTION}

  core:
    networks:
      - enervision_network
    build:
      context: .
      dockerfile: backend/core/Dockerfile

    ports:
      - "8002:8000"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

    volumes:
      - ./backend/core:/backend/core
      - ./backend/shared:/backend/shared

    depends_on:
      postgres:
        condition: service_healthy

  etl:
    networks:
      - enervision_network
    build:
      context: .
      dockerfile: backend/etl/Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_SAS_ETL: ${AZURE_SAS_ETL}
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-60}
      ETL_LOOKBACK_MINUTES: ${ETL_LOOKBACK_MINUTES:-1440}
      ETL_FORWARD_FILL_DEPTH: ${ETL_FORWARD_FILL_DEPTH:-3}

    volumes:
      - ./backend/etl:/backend/etl

    command: python -m etl.main

  prediction:
    networks:
      - enervision_network
    build:
      context: .
      dockerfile: backend/prediction/Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      DVC_ROOT: /backend

    volumes:
      - ./backend/prediction:/backend/prediction
      - ./backend/shared:/backend/shared
      - ./.dvc:/backend/.dvc
      - ./data:/backend/data

    command: python -m prediction.main

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keycloak_db_data:

networks:
  enervision_network:
    external: true
    name: enervision_network

secrets:
  keycloak_client_secret:
    file: ./secrets/keycloak_client_secret

  keycloak_frontend_client_secret:
    file: ./secrets/keycloak_frontend_client_secret

  keycloak_db_password:
    file: ./secrets/keycloak_db_password
