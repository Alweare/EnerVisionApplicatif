services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    cap_add:
      - NET_BIND_SERVICE
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yml
    ports:
      - 443:443
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
  backend:
    networks:
      - enervision_network
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/backend

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PWD: ${POSTGRES_APP_PWD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    secrets:
      - keycloak_client_secret
    depends_on:
      - keycloak

  keycloak:
    build:
      context: .
      dockerfile: backend/authentication/Dockerfile
    networks:
      - enervision_network
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
    secrets:
      - keycloak_client_secret
      - keycloak_frontend_client_secret
      - keycloak_db_password
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    networks:
      - enervision_network
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    secrets:
      - keycloak_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    networks:
      - enervision_network
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/frontend

  worker-ingestion:
    build:
      context: .
      dockerfile: backend/workerIngestion/Dockerfile

    ports:
      - "8001:8000"

    environment:
      MOCK_API_URL: http://10.105.200.45:8000

    volumes:
      - ./backend/__init__.py:/backend/__init__.py
      - ./backend/core:/backend/core
      - ./backend/workerIngestion:/backend/workerIngestion

    command: uvicorn workerIngestion.main:app --host 0.0.0.0 --port 8000 --reload

secrets:
  db_password:
    file: ./secrets/db_password

  keycloak_client_secret:
    file: ./secrets/keyCloakSecrets/keycloak_client_secret

  keycloak_frontend_client_secret:
    file: ./secrets/keyCloakSecrets/keycloak_frontend_client_secret

  keycloak_db_password:
    file: ./secrets/keyCloakSecrets/keycloak_db_password

networks:
  enervision_network:
    external: true

volumes:
  keycloak_db_data: